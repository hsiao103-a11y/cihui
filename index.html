<!-- 引入 Firebase SDK 與 QRCode.js -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
  // 1. 填入 Firebase 專案設定
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };
  
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();
  const passCountRef = database.ref('passCount');

  // 2. 自動產生當前網頁的 QR Code (供手機掃描)
  new QRCode(document.getElementById("qrcode"), {
    text: window.location.href,
    width: 200,
    height: 200
  });

  // 3. 大螢幕端：即時監聽資料庫變更並更新畫面數字
  passCountRef.on('value', (snapshot) => {
    const currentCount = snapshot.val() || 0;
    const countElement = document.getElementById('pass-count-display');
    if (countElement) {
      countElement.innerText = currentCount;
    }
  });

  // 4. 手機端：當判斷達成「連續兩次聖筊」時呼叫此函式
  function recordPassSuccess() {
    passCountRef.transaction((currentCount) => {
      return (currentCount || 0) + 1;
    });
  }
</script>
