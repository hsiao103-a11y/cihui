<!-- 引入 QRCode 生成套件 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
  // 替換為你在 Apps Script 取得的 Web 應用程式 URL
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbz678wM2Zcc06LcJuWsnSLgm3ADWa9obL0RGUC7Bngz5iLa2Z07INozhOia1WOtxkDo/exec";

  // 1. 生成 QR Code (指向你的 GitHub Pages 網址)
  new QRCode(document.getElementById("qrcode"), {
    text: "https://hsiao103-a11y.github.io/cihui/",
    width: 180,
    height: 180
  });

  // 2. 大螢幕端：定期查詢並更新人數 (輪詢 Polling，每 2 秒一次)
  function fetchPassCount() {
    fetch(GAS_API_URL)
      .then(res => res.json())
      .then(data => {
        const display = document.getElementById('pass-count');
        if (display) display.innerText = data.count;
      })
      .catch(err => console.error("抓取失敗:", err));
  }

  // 啟動定時監聽
  setInterval(fetchPassCount, 2000);
  fetchPassCount(); // 初始化讀取

  // 3. 手機端：連續兩次聖筊觸發過關時呼叫
  function onSuccessTwoDivines() {
    fetch(`${GAS_API_URL}?action=add`)
      .then(res => res.json())
      .then(data => {
        console.log("過關紀錄成功，最新人數：", data.count);
      })
      .catch(err => console.error("更新失敗:", err));
  }
</script>
